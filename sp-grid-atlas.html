<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SP Grid Atlas — 6.6KV/LV Substations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css"/>
<style>
  :root{
    --bg:#07070d; --bg-2:#0d0d18;
    --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.085); --glass-3:rgba(255,255,255,.12);
    --stroke:rgba(255,255,255,.10); --stroke-2:rgba(255,255,255,.17);
    --ink:#f7f7fa; --ink-dim:rgba(247,247,250,.62); --ink-faint:rgba(247,247,250,.38);
    --accent:#e8002d; --accent-2:#ff4f6e; --accent-ink:#ffffff;
    --grad:linear-gradient(135deg,#ff2d55 0%,#e8002d 55%,#b30022 100%);
    --glow:0 10px 30px rgba(232,0,45,.42);
    --lift:0 24px 60px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
    --z-central:#818cf8; --z-east:#fbbf24; --z-ne:#34d399;
    --z-north:#f472b6; --z-west:#60a5fa; --z-south:#fb7185;
    --font-b:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',Arial,sans-serif;
    --font-d:var(--font-b);
    --font-m:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r-panel:30px; --r-card:20px; --r-field:15px; --pill:980px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-b);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ambient colour orbs — the signature Design+Code backdrop */
  .stage::before,.stage::after{content:"";position:absolute;z-index:2;pointer-events:none;
    border-radius:50%;filter:blur(110px);opacity:.4}
  .stage::before{width:640px;height:640px;left:-180px;top:-240px;
    background:radial-gradient(circle,rgba(232,0,45,.6),transparent 68%)}
  .stage::after{width:760px;height:760px;right:-260px;bottom:-300px;
    background:radial-gradient(circle,rgba(88,86,214,.5),transparent 68%)}

  .app{position:relative;height:100%;isolation:isolate}
  .stage{position:absolute;inset:0;z-index:1}

  /* floating glass rail over a full-bleed map */
  .rail{position:absolute;left:18px;top:18px;bottom:18px;width:382px;z-index:600;
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    border-radius:var(--r-panel);
    background:radial-gradient(130% 55% at 0% 0%,rgba(232,0,45,.20),transparent 62%),
               radial-gradient(120% 50% at 100% 100%,rgba(88,86,214,.20),transparent 62%),
               rgba(13,13,24,.7);
    backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);
    box-shadow:var(--lift)}
  /* 1px gradient hairline, brightest at the top edge */
  .rail::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 38%,rgba(255,255,255,.02));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude}
  @media(max-width:860px){
    .rail{left:10px;right:10px;top:10px;bottom:auto;width:auto;max-height:64vh}
  }

  .brand{padding:26px 24px 22px;border-bottom:1px solid var(--stroke);flex:none}
  .brand h1{font-family:var(--font-d);font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.04;
    background:linear-gradient(180deg,#fff 20%,rgba(255,255,255,.62));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-size:13px;color:var(--ink-dim);margin-top:7px;letter-spacing:-.005em}
  .stat{display:flex;gap:10px;margin-top:20px}
  .stat>div{flex:1;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-field);
    padding:11px 12px;transition:background .2s,border-color .2s}
  .stat>div:hover{background:var(--glass-2);border-color:var(--stroke-2)}
  .stat b{font-family:var(--font-d);font-size:21px;font-weight:700;display:block;line-height:1;
    letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;color:var(--ink-faint);display:block;margin-top:6px;
    text-transform:uppercase;letter-spacing:.07em;font-weight:500}

  .controls{padding:18px 24px;border-bottom:1px solid var(--stroke);flex:none}
  .search{position:relative}
  .search input{width:100%;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-field);
    padding:12px 14px 12px 40px;color:var(--ink);font-family:var(--font-b);font-size:14px;outline:none;
    transition:border-color .2s,background .2s,box-shadow .2s}
  .search input::placeholder{color:var(--ink-faint)}
  .search input:focus{border-color:rgba(232,0,45,.65);background:var(--glass-2);
    box-shadow:0 0 0 4px rgba(232,0,45,.14)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
  .row{display:flex;gap:10px;margin-top:12px;align-items:center}
  .row label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
  select{flex:1;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-field);color:var(--ink);
    padding:10px 12px;font-family:var(--font-b);font-size:13px;outline:none;cursor:pointer;transition:.2s}
  select:hover{background:var(--glass-2);border-color:var(--stroke-2)}
  select option{background:#14141f;color:var(--ink)}

  .zones{padding:18px 24px;border-bottom:1px solid var(--stroke);flex:none}
  .zones .hd{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;
    font-weight:500;margin-bottom:12px}
  .zgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .zbtn{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--stroke);
    border-radius:var(--r-field);padding:10px 12px;cursor:pointer;color:var(--ink);
    font-family:var(--font-b);font-size:13px;font-weight:500;text-align:left;
    transition:background .2s,border-color .2s,transform .18s}
  .zbtn:hover{background:var(--glass-2);border-color:var(--stroke-2);transform:translateY(-1px)}
  .zbtn.off{opacity:.35}
  .zbtn .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
  .zbtn .zn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zbtn .zc{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .zall{display:flex;gap:8px;margin-top:10px}
  .zall button{flex:1;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--pill);
    color:var(--ink-dim);padding:9px;font-size:12.5px;font-family:var(--font-b);font-weight:500;
    cursor:pointer;transition:.2s}
  .zall button:hover{color:var(--ink);background:var(--glass-2);border-color:var(--stroke-2)}

  .cluster{padding:18px 24px;border-bottom:1px solid var(--stroke);flex:none}
  .cl-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--glass);border:1px solid var(--stroke);border-radius:var(--pill);color:var(--ink);
    font-family:var(--font-b);font-size:14px;font-weight:600;padding:12px;cursor:pointer;
    transition:background .2s,border-color .2s,box-shadow .2s,transform .18s}
  .cl-btn:hover:not(:disabled):not(.on){background:var(--glass-2);border-color:var(--stroke-2);transform:translateY(-1px)}
  .cl-btn:disabled{opacity:.35;cursor:not-allowed}
  .cl-btn .st{font-size:11px;font-weight:500;color:var(--ink-faint);border:1px solid var(--stroke-2);
    border-radius:var(--pill);padding:2px 10px}
  .cl-btn.on{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:var(--glow)}
  .cl-btn.on:hover{transform:translateY(-1px);box-shadow:0 14px 38px rgba(232,0,45,.5)}
  .cl-btn.on .st{color:var(--accent-ink);border-color:rgba(255,255,255,.45)}

  .visited{padding:18px 24px 12px;border-bottom:1px solid var(--stroke);flex:none}
  .vhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .vhd>span{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
  .seg{display:flex;background:rgba(0,0,0,.34);border:1px solid var(--stroke);border-radius:var(--pill);padding:3px}
  .seg button{border:none;background:transparent;border-radius:var(--pill);padding:4px 11px;
    font-family:var(--font-b);font-size:11px;font-weight:500;color:var(--ink-faint);cursor:pointer;transition:.2s}
  .seg button:hover:not(.on){color:var(--ink)}
  .seg button.on{background:var(--glass-3);color:var(--ink)}
  .vrow{display:flex;align-items:center;gap:10px;padding:9px 11px;margin:0 -11px;border-radius:14px;
    cursor:pointer;transition:background .18s}
  .vrow:hover,.vrow.active{background:var(--glass)}
  .vrow .vn{width:16px;flex:none;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .vrow .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 9px currentColor}
  .vrow .nm{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vrow .vc{flex:none;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  .list{flex:1;overflow-y:auto;min-height:0;padding:8px 14px 20px;
    -webkit-mask:linear-gradient(180deg,#000 calc(100% - 34px),transparent);
    mask:linear-gradient(180deg,#000 calc(100% - 34px),transparent)}
  .list::-webkit-scrollbar{width:10px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px;
    border:3px solid transparent;background-clip:padding-box}
  .list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);background-clip:padding-box}
  .item{padding:12px 12px;border-radius:14px;cursor:pointer;display:flex;gap:12px;align-items:center;
    transition:background .18s,transform .18s}
  .item:hover{background:var(--glass);transform:translateX(2px)}
  .item.active{background:var(--glass-2);box-shadow:inset 2px 0 0 var(--accent)}
  .item .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
  .item .nm{flex:1;font-size:13.5px;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .zg{font-size:11.5px;color:var(--ink-faint)}
  .empty{padding:42px 24px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:1.65}

  #map{position:absolute;inset:0;background:var(--bg-2)}
  .leaflet-container{background:var(--bg-2);font-family:var(--font-b)}
  .leaflet-top.leaflet-left{margin-left:400px}
  .leaflet-bar{border:1px solid var(--stroke)!important;border-radius:14px;overflow:hidden;
    box-shadow:var(--lift);backdrop-filter:blur(24px)}
  .leaflet-bar a{background:rgba(13,13,24,.7);color:var(--ink);border-bottom-color:var(--stroke)}
  .leaflet-bar a:hover{background:rgba(30,30,44,.85);color:var(--ink)}
  .leaflet-control-attribution{background:rgba(13,13,24,.7)!important;color:var(--ink-faint);
    border-radius:10px 0 0 0;font-size:10.5px;backdrop-filter:blur(18px)}
  .leaflet-control-attribution a{color:var(--ink-dim)}
  .leaflet-popup-content-wrapper{background:rgba(16,16,28,.84);color:var(--ink);border-radius:var(--r-card);
    border:1px solid var(--stroke-2);box-shadow:var(--lift);backdrop-filter:blur(30px) saturate(180%)}
  .leaflet-popup-tip{background:rgba(16,16,28,.84);border:1px solid var(--stroke-2)}
  .leaflet-popup-content{margin:17px 19px;font-family:var(--font-b)}
  .leaflet-popup-close-button{color:var(--ink-faint)!important}
  .pop h3{font-family:var(--font-d);font-size:16px;font-weight:700;letter-spacing:-.018em;margin-bottom:11px}
  .pop .prow{display:flex;justify-content:space-between;gap:24px;font-size:12.5px;padding:6px 0;
    border-top:1px solid var(--stroke)}
  .pop .prow span{color:var(--ink-dim)}
  .pop .prow b{font-family:var(--font-m);font-weight:500}
  .pop .zbadge{display:inline-flex;align-items:center;gap:7px;margin-top:11px;font-size:12.5px;color:var(--ink-dim)}
  .pop .zbadge .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .leaflet-container a.gmaps{display:block;margin-top:14px;text-align:center;background:var(--grad);
    color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:13px;padding:10px;
    border-radius:var(--pill);font-family:var(--font-b);box-shadow:var(--glow);transition:.2s}
  .leaflet-container a.gmaps:hover{box-shadow:0 14px 38px rgba(232,0,45,.5)}

  .legend,.counter,.offline,.basemap{background:rgba(13,13,24,.66);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border:1px solid var(--stroke);box-shadow:var(--lift)}
  .legend{position:absolute;right:18px;bottom:30px;z-index:500;border-radius:var(--r-card);
    padding:16px 18px;font-size:12.5px}
  .legend .lt{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;
    font-weight:500;margin-bottom:10px}
  .legend .lr{display:flex;align-items:center;gap:10px;padding:3px 0;color:var(--ink-dim)}
  .legend .lr .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .dscale{display:flex;gap:3px;margin-bottom:7px}
  .dsw{flex:1;height:12px;border-radius:4px;min-width:24px}
  .dends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint)}
  .counter{position:absolute;left:400px;top:92px;z-index:500;border-radius:var(--pill);
    padding:10px 16px;font-size:12.5px;color:var(--ink-dim)}
  .counter b{color:var(--ink);font-weight:700}
  .offline{position:absolute;left:400px;bottom:30px;z-index:500;border-radius:var(--r-field);
    padding:11px 15px;font-size:11.5px;color:var(--ink-dim);max-width:270px;line-height:1.45}
  .basemap{position:absolute;right:18px;top:18px;z-index:500;display:flex;gap:5px;padding:5px;
    border-radius:var(--pill)}
  .basemap button{background:transparent;border:none;border-radius:var(--pill);padding:7px 18px;
    font-family:var(--font-b);font-size:12.5px;font-weight:600;color:var(--ink-faint);cursor:pointer;transition:.2s}
  .basemap button:hover:not(.on){color:var(--ink);background:var(--glass)}
  .basemap button.on{background:var(--grad);color:var(--accent-ink);box-shadow:var(--glow)}

  .cl-icon{border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-b);font-size:13px;font-weight:700;border:2px solid rgba(255,255,255,.55);
    box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.06)}

  /* ── Route planner ───────────────────────────────────────── */
  .plan{padding:18px 24px 0;flex:none}
  .plan-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--grad);border:none;border-radius:var(--pill);color:var(--accent-ink);
    font-family:var(--font-b);font-size:14.5px;font-weight:600;padding:13px;cursor:pointer;
    box-shadow:var(--glow);transition:box-shadow .2s,transform .18s,background .2s}
  .plan-btn:hover{transform:translateY(-1px);box-shadow:0 16px 40px rgba(232,0,45,.52)}
  .plan-btn.on{background:var(--glass);border:1px solid var(--stroke);color:var(--ink);box-shadow:none}
  .plan-btn.on:hover{background:var(--glass-2);box-shadow:none}

  .rp{display:flex;flex-direction:column;flex:1;min-height:0}
  .rp-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:20px 24px 15px;border-bottom:1px solid var(--stroke);flex:none}
  .rp-hd h2{font-family:var(--font-d);font-size:19px;font-weight:700;letter-spacing:-.022em;
    background:linear-gradient(180deg,#fff,rgba(255,255,255,.66));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .rp-x{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--glass);border:1px solid var(--stroke);border-radius:50%;color:var(--ink-dim);
    font-size:16px;line-height:1;cursor:pointer;transition:.2s}
  .rp-x:hover{color:var(--ink);background:var(--glass-2);border-color:var(--stroke-2)}

  .rp-body{flex:1;min-height:0;overflow-y:auto;padding:18px 24px 22px}
  .rp-body::-webkit-scrollbar{width:10px}
  .rp-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px;
    border:3px solid transparent;background-clip:padding-box}

  .rp-hq{display:flex;align-items:center;gap:13px;background:var(--glass);
    border:1px solid var(--stroke);border-radius:var(--r-card);padding:13px 15px}
  .rp-hq .sq{width:30px;height:30px;flex:none;border-radius:10px;background:var(--grad);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
    letter-spacing:.02em;box-shadow:var(--glow)}
  .rp-hq .tx{flex:1;min-width:0;display:block}
  .rp-hq .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-hq .ad{display:block;font-size:11px;color:var(--ink-faint);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-hq .tag{flex:none;font-size:10.5px;color:var(--accent-2);border:1px solid rgba(255,79,110,.35);
    border-radius:var(--pill);padding:3px 10px;white-space:nowrap;background:rgba(232,0,45,.12)}

  .rp-count{display:flex;align-items:center;justify-content:space-between;margin-top:20px;
    font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
  .rp-count b{font-size:12.5px;color:var(--ink);font-weight:700;letter-spacing:0;text-transform:none}

  .rp-search{position:relative;margin-top:11px}
  .rp-search input{width:100%;background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-field);
    padding:12px 15px;color:var(--ink);font-family:var(--font-b);font-size:14px;outline:none;transition:.2s}
  .rp-search input::placeholder{color:var(--ink-faint)}
  .rp-search input:focus{border-color:rgba(232,0,45,.65);background:var(--glass-2);
    box-shadow:0 0 0 4px rgba(232,0,45,.14)}
  .rp-search input:disabled{opacity:.55;cursor:not-allowed}
  .rp-drop{position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:30;max-height:236px;overflow-y:auto;
    background:rgba(18,18,30,.92);backdrop-filter:blur(30px) saturate(180%);
    border:1px solid var(--stroke-2);border-radius:var(--r-card);box-shadow:var(--lift);padding:6px}
  .rp-drop::-webkit-scrollbar{width:10px}
  .rp-drop::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px;
    border:3px solid transparent;background-clip:padding-box}
  .rp-drop .r{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
    border-radius:12px;transition:background .15s}
  .rp-drop .r:hover{background:var(--glass-2)}
  .rp-drop .r .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
  .rp-drop .r .nm{flex:1;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-drop .r .zg{font-size:11px;color:var(--ink-faint)}
  .rp-none{padding:15px;text-align:center;font-size:12.5px;color:var(--ink-faint)}

  .rp-stops{display:flex;flex-direction:column;gap:9px;margin-top:15px}
  .rp-stop{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--stroke);
    border-radius:var(--r-card);padding:11px 13px;transition:background .2s,border-color .2s}
  .rp-stop:hover{background:var(--glass-2);border-color:var(--stroke-2)}
  .rp-stop .bg{width:26px;height:26px;flex:none;border-radius:50%;color:#0b0b14;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 0 14px currentColor}
  .rp-stop .nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-stop .zg{flex:none;font-size:11px;color:var(--ink-faint)}
  .rp-rm{flex:none;background:transparent;border:none;color:var(--ink-faint);cursor:pointer;
    font-size:16px;line-height:1;padding:2px 4px;transition:color .2s}
  .rp-rm:hover{color:var(--accent-2)}
  @keyframes rpflash{0%{background:rgba(232,0,45,.32);border-color:var(--accent-2);transform:translateX(6px)}
    100%{background:var(--glass);border-color:var(--stroke);transform:none}}
  .rp-stop.flash{animation:rpflash .7s cubic-bezier(.22,1,.36,1)}
  .rp-hint{margin-top:15px;padding:26px 18px;text-align:center;border:1px dashed var(--stroke-2);
    border-radius:var(--r-card);color:var(--ink-faint);font-size:12.5px;line-height:1.65}

  .rp-act{display:flex;flex-direction:column;gap:9px;padding:18px 24px;border-top:1px solid var(--stroke);flex:none}

    font-family:var(--font-b);font-size:14px;font-weight:600;background:var(--glass);color:var(--ink);
    transition:background .2s,box-shadow .2s,transform .18s,opacity .2s}
  .rp-btn:disabled{opacity:.32;cursor:not-allowed}
  a.rp-btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
  .rp-btn.primary{background:var(--grad);color:var(--accent-ink);border-color:transparent;box-shadow:var(--glow)}
  .rp-btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 40px rgba(232,0,45,.52)}
  .rp-btn.ghost:hover:not(:disabled){background:var(--glass-2);border-color:var(--stroke-2);transform:translateY(-1px)}
  .rp-btn.quiet{background:transparent;border-color:transparent;color:var(--ink-faint);font-weight:500}
  .rp-btn.quiet:hover:not(:disabled){color:var(--ink);background:var(--glass)}

  .rp-hq-icon{width:30px;height:30px;border-radius:10px;background:var(--grad);color:#fff;
    border:1.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
    font-family:var(--font-b);font-size:9.5px;font-weight:700;box-shadow:var(--glow)}
  .rp-num-icon{width:28px;height:28px;border-radius:50%;color:#0b0b14;border:2px solid rgba(255,255,255,.75);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-b);font-size:12px;
    font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.5)}
</style>

<script type="text/babel">
const {useState,useMemo,useRef,useEffect} = React;

const ZONES = {
  "Central":   {color:"var(--z-central)", hex:"#818cf8"},
  "East":      {color:"var(--z-east)",    hex:"#fbbf24"},
  "North-East":{color:"var(--z-ne)",      hex:"#34d399"},
  "North":     {color:"var(--z-north)",   hex:"#f472b6"},
  "West":      {color:"var(--z-west)",    hex:"#60a5fa"},
  "South":     {color:"var(--z-south)",   hex:"#fb7185"},
};
const ZONE_ORDER = ["Central","East","North-East","North","West","South"];
const DATA = window.SUBSTATIONS;
const BY_NAME = Object.fromEntries(DATA.map(d=>[d.name,d]));

const HQ = {name:"SP Group HQ", address:"2 Kallang Sector, Singapore 349277", lat:1.3127, lng:103.8698};
const MAX_STOPS = 5;

const BASEMAPS = {
  dark: {label:"Dark",  url:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"},
  light:{label:"Light", url:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"},
};
const BASEMAP_ORDER = ["dark","light"];

// Single-hue SP-red ordinal ramp for cluster density, light -> dark. Both variants
// pass lightness monotonicity, adjacent-step separation, and the 2:1 floor against
// their own surface; label ink flips to white where white wins on contrast.
const DENSITY = {
  light:[{c:"#fd8883",t:"#1d1d1f"},{c:"#fc454c",t:"#1d1d1f"},{c:"#db132e",t:"#ffffff"},
         {c:"#ac0c22",t:"#ffffff"},{c:"#7f0616",t:"#ffffff"}],
  dark: [{c:"#fec8c4",t:"#1d1d1f"},{c:"#fd948e",t:"#1d1d1f"},{c:"#fc4e52",t:"#1d1d1f"},
         {c:"#da122d",t:"#ffffff"},{c:"#a50b20",t:"#ffffff"}],
};
const DENSITY_BINS = [5,10,20,40];          // upper bounds for bins 0..3, rest bin 4
const DENSITY_LABELS = ["2–4","5–9","10–19","20–39","40+"];
const densityBin = n => DENSITY_BINS.findIndex(b=>n<b)===-1 ? 4 : DENSITY_BINS.findIndex(b=>n<b);

// Tiles come from an external CDN. Corporate networks and sandboxed viewers often
// block it, which would otherwise leave a blank map, so failures are reported back
// and the embedded vector coastline stands in.
function makeTileLayer(key,onErr,onOk){
  return L.tileLayer(BASEMAPS[key].url,{maxZoom:19,subdomains:"abcd",
    attribution:'&copy; OpenStreetMap &copy; CARTO'}).on("tileerror",onErr).on("tileload",onOk);
}

// localStorage is unavailable on some file:// and private-window configurations,
// so visit history degrades to in-memory rather than breaking the app.
const VISITS_KEY="spGridAtlas.visits";
function loadVisits(){
  try{return JSON.parse(localStorage.getItem(VISITS_KEY))||{};}catch(e){return {};}
}
function saveVisits(v){
  try{localStorage.setItem(VISITS_KEY,JSON.stringify(v));}catch(e){}
}
function sinceLabel(t){
  const m=Math.floor((Date.now()-t)/60000);
  if(m<1) return "just now";
  if(m<60) return m+"m ago";
  const h=Math.floor(m/60); if(h<24) return h+"h ago";
  return Math.floor(h/24)+"d ago";
}

// Sorting every vertex by its bearing around an interior point always yields a
// simple polygon, so the route can never cross itself.
function angularSweepRoute(hq,stops){
  if(stops.length<2) return [...stops];
  const ring=[hq,...stops];
  const cLat=ring.reduce((s,p)=>s+p.lat,0)/ring.length;
  const cLng=ring.reduce((s,p)=>s+p.lng,0)/ring.length;
  const bearing=p=>{
    const a=Math.atan2(p.lat-cLat,(p.lng-cLng)*Math.cos(cLat*Math.PI/180));
    return a<0?a+2*Math.PI:a;
  };
  const swept=[...ring].sort((a,b)=>bearing(a)-bearing(b));
  const h=swept.indexOf(hq);
  return [...swept.slice(h+1),...swept.slice(0,h)];
}

function Icon(){return <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;}
function RouteIcon(){return <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19h6a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7h6"/></svg>;}

function App(){
  const [q,setQ]=useState("");
  const [sort,setSort]=useState("name");
  const [active,setActive]=useState(new Set(ZONE_ORDER));
  const [sel,setSel]=useState(null);
  const [routeMode,setRouteMode]=useState(false);
  const [stops,setStops]=useState([]);
  const [rq,setRq]=useState("");
  const [flash,setFlash]=useState(false);
  const [basemap,setBasemap]=useState("dark");
  const [cluster,setCluster]=useState(false);
  const [tilesBlocked,setTilesBlocked]=useState(false);
  const [copied,setCopied]=useState(false);
  const [visits,setVisits]=useState(()=>loadVisits());
  const [visitMode,setVisitMode]=useState("often");
  const mapRef=useRef(null); const markersRef=useRef({}); const elRef=useRef(null);
  const routeLayerRef=useRef(null); const tileRef=useRef(null); const clusterRef=useRef(null);
  const outlineRef=useRef(null);
  // the cluster icon builder is created once, so it reads the live basemap from a ref
  const basemapRef=useRef(basemap); basemapRef.current=basemap;
  const canCluster = typeof L.markerClusterGroup === "function";

  const counts=useMemo(()=>{const c={};DATA.forEach(d=>c[d.zone]=(c[d.zone]||0)+1);return c;},[]);

  const filtered=useMemo(()=>{
    let r=DATA.filter(d=>active.has(d.zone));
    if(q.trim()){const s=q.trim().toLowerCase();r=r.filter(d=>d.name.toLowerCase().includes(s)||d.zone.toLowerCase().includes(s));}
    r=[...r].sort((a,b)=> sort==="name"?a.name.localeCompare(b.name)
      : sort==="zone"?(a.zone.localeCompare(b.zone)||a.name.localeCompare(b.name))
      : sort==="lat"?b.lat-a.lat : a.lng-b.lng);
    return r;
  },[q,sort,active]);

  // init map once
  useEffect(()=>{
    const map=L.map(elRef.current,{zoomControl:true,attributionControl:true}).setView([1.352,103.84],11.4);
    tileRef.current=makeTileLayer("dark",()=>setTilesBlocked(true),()=>setTilesBlocked(false)).addTo(map);
    mapRef.current=map;
    DATA.forEach(d=>{
      const m=L.circleMarker([d.lat,d.lng],{radius:6,weight:1.5,color:"#0b1119",
        fillColor:ZONES[d.zone].hex,fillOpacity:.95}).addTo(map);
      const g="https://www.google.com/maps/search/?api=1&query="+d.lat+","+d.lng;
      m.bindPopup(
        '<div class="pop"><h3>'+d.name+'</h3>'+
        '<div class="prow"><span>Voltage</span><b>'+d.voltage+'</b></div>'+
        '<div class="prow"><span>Lat</span><b>'+d.lat.toFixed(5)+'</b></div>'+
        '<div class="prow"><span>Long</span><b>'+d.lng.toFixed(5)+'</b></div>'+
        '<div class="zbadge"><span class="dot" style="background:'+ZONES[d.zone].hex+'"></span>'+d.zone+' Zone</div>'+
        '<a class="gmaps" href="'+g+'" target="_blank" rel="noopener">Open in Google Maps</a></div>');
      m.on("click",()=>{setSel(d.name);recordVisit(d.name);});
      markersRef.current[d.name]=m;
    });
    routeLayerRef.current=L.layerGroup().addTo(map);
    if(canCluster){
      clusterRef.current=L.markerClusterGroup({
        showCoverageOnHover:false, maxClusterRadius:60, chunkedLoading:true,
        iconCreateFunction:c=>{
          const n=c.getChildCount(), b=densityBin(n);
          const {c:fill,t:ink}=DENSITY[basemapRef.current][b];
          const size=34+b*5;
          return L.divIcon({className:"",iconSize:[size,size],
            html:'<div class="cl-icon" style="width:'+size+'px;height:'+size+'px;background:'+fill+
                 ';color:'+ink+'">'+n+'</div>'});
        }
      });
    }
    return ()=>map.remove();
  },[]);

  // swap the tile layer without disturbing markers or the current view
  useEffect(()=>{
    const map=mapRef.current; if(!map||!tileRef.current) return;
    map.removeLayer(tileRef.current);
    tileRef.current=makeTileLayer(basemap,()=>setTilesBlocked(true),()=>setTilesBlocked(false)).addTo(map);
    if(clusterRef.current&&map.hasLayer(clusterRef.current)) clusterRef.current.refreshClusters();
  },[basemap]);

  // vector coastline fallback, shown only when the tile CDN is unreachable
  useEffect(()=>{
    const map=mapRef.current; if(!map) return;
    if(outlineRef.current){map.removeLayer(outlineRef.current);outlineRef.current=null;}
    if(!tilesBlocked) return;
    const dark=basemap==="dark";
    outlineRef.current=L.geoJSON({type:"Feature",geometry:window.SG_OUTLINE},{
      interactive:false,
      style:{color:dark?"#3a3a3e":"#b8b8bd",weight:1,
        fillColor:dark?"#1f1f23":"#ffffff",fillOpacity:1}
    }).addTo(map);
    outlineRef.current.bringToBack();
  },[tilesBlocked,basemap]);

  // draw HQ marker, numbered stop markers and the closed-loop polyline
  useEffect(()=>{
    const layer=routeLayerRef.current; if(!layer) return;
    layer.clearLayers();
    if(!routeMode||stops.length===0) return;

    const line=[[HQ.lat,HQ.lng],...stops.map(s=>[s.lat,s.lng]),[HQ.lat,HQ.lng]];
    L.polyline(line,{color:"#e8002d",weight:3.5,opacity:.9,dashArray:"9 7",lineJoin:"round"}).addTo(layer);

    L.marker([HQ.lat,HQ.lng],{
      icon:L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,13],html:'<div class="rp-hq-icon">HQ</div>'}),
      zIndexOffset:1000
    }).addTo(layer).bindPopup(
      '<div class="pop"><h3>SP Group HQ</h3>'+
      '<div class="prow"><span>Address</span><b>2 Kallang Sector</b></div>'+
      '<div class="prow"><span>Postal</span><b>349277</b></div>'+
      '<div class="prow"><span>Role</span><b>Start &amp; end</b></div></div>');

    stops.forEach((s,i)=>{
      L.marker([s.lat,s.lng],{
        icon:L.divIcon({className:"",iconSize:[24,24],iconAnchor:[12,12],
          html:'<div class="rp-num-icon" style="background:'+ZONES[s.zone].hex+'">'+(i+1)+'</div>'}),
        zIndexOffset:900
      }).addTo(layer).bindPopup(
        '<div class="pop"><h3>Stop '+(i+1)+' — '+s.name+'</h3>'+
        '<div class="prow"><span>Lat</span><b>'+s.lat.toFixed(5)+'</b></div>'+
        '<div class="prow"><span>Long</span><b>'+s.lng.toFixed(5)+'</b></div>'+
        '<div class="zbadge"><span class="dot" style="background:'+ZONES[s.zone].hex+'"></span>'+s.zone+' Zone</div></div>');
    });
  },[routeMode,stops]);

  const rResults=useMemo(()=>{
    const s=rq.trim().toLowerCase(); if(!s) return [];
    const taken=new Set(stops.map(x=>x.name));
    return DATA.filter(d=>!taken.has(d.name)&&d.name.toLowerCase().includes(s)).slice(0,8);
  },[rq,stops]);

  function addStop(d){
    if(stops.length>=MAX_STOPS||stops.some(s=>s.name===d.name)) return;
    const next=[...stops,d];
    setStops(next); setRq("");
    mapRef.current.flyToBounds(
      L.latLngBounds([[HQ.lat,HQ.lng],...next.map(s=>[s.lat,s.lng])]),
      {padding:[70,70],duration:.6,maxZoom:15});
  }
  function removeStop(name){setStops(stops.filter(s=>s.name!==name));}
  function optimiseRoute(){
    if(stops.length<2) return;
    setStops(angularSweepRoute(HQ,stops));
    setFlash(true); setTimeout(()=>setFlash(false),700);
  }
  // 6dp is ~0.1m and matches the precision Google itself normalises a /dir/ URL to
  const routeUrl=useMemo(()=>{
    if(!stops.length) return "";
    return "https://www.google.com/maps/dir/"+
      [HQ,...stops,HQ].map(p=>p.lat.toFixed(6)+","+p.lng.toFixed(6)).join("/");
  },[stops]);

  function copyRouteLink(){
    if(!routeUrl) return;
    const done=()=>{setCopied(true);setTimeout(()=>setCopied(false),1600);};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(routeUrl).then(done,()=>fallbackCopy(routeUrl,done));
    }else fallbackCopy(routeUrl,done);
  }
  function fallbackCopy(text,done){
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}finally{document.body.removeChild(ta);}
  }
  function clearRoute(){setStops([]);setRq("");}
  function exitRoute(){setRouteMode(false);setStops([]);setRq("");}

  // show/hide markers by zone+search, routed through the cluster group when clustering is on
  useEffect(()=>{
    const map=mapRef.current; if(!map) return;
    const cg=clusterRef.current;
    const vis=new Set(filtered.map(d=>d.name));
    if(cluster&&cg){
      const inCluster=[];
      Object.entries(markersRef.current).forEach(([nm,m])=>{
        if(map.hasLayer(m)) map.removeLayer(m);
        if(vis.has(nm)) inCluster.push(m);
      });
      cg.clearLayers();
      cg.addLayers(inCluster);
      if(!map.hasLayer(cg)) map.addLayer(cg);
    }else{
      if(cg&&map.hasLayer(cg)){map.removeLayer(cg);cg.clearLayers();}
      Object.entries(markersRef.current).forEach(([nm,m])=>{
        if(!map.hasLayer(m)) m.addTo(map);
        const el=m.getElement();
        if(el) el.style.display=vis.has(nm)?"":"none";
      });
    }
  },[filtered,cluster]);

  function recordVisit(name){
    setVisits(prev=>{
      const cur=prev[name]||{n:0,t:0};
      const next={...prev,[name]:{n:cur.n+1,t:Date.now()}};
      saveVisits(next); return next;
    });
  }

  const topVisited=useMemo(()=>{
    const rows=Object.entries(visits).map(([name,v])=>({d:BY_NAME[name],...v}))
      .filter(r=>r.d);
    rows.sort(visitMode==="often" ? (a,b)=>b.n-a.n||b.t-a.t : (a,b)=>b.t-a.t);
    return rows.slice(0,5);
  },[visits,visitMode]);

  function flyTo(d){const m=mapRef.current;const mk=markersRef.current[d.name];recordVisit(d.name);
    if(cluster&&clusterRef.current&&clusterRef.current.hasLayer(mk)){
      setSel(d.name);clusterRef.current.zoomToShowLayer(mk,()=>mk.openPopup());return;}
    m.flyTo([d.lat,d.lng],16,{duration:.7});
    setTimeout(()=>mk.openPopup(),650);setSel(d.name);}
  function zoomZone(z){
    const pts=DATA.filter(d=>d.zone===z);if(!pts.length)return;
    const b=L.latLngBounds(pts.map(d=>[d.lat,d.lng]));
    mapRef.current.flyToBounds(b,{padding:[50,50],duration:.7,maxZoom:14.5});
    setActive(new Set([z]));
  }
  function toggleZone(z){const n=new Set(active);n.has(z)?n.delete(z):n.add(z);setActive(n);}
  function resetView(){mapRef.current.flyTo([1.352,103.84],11.4,{duration:.7});}

  return (
   <div className="app">
    <div className="rail">
      <div className="brand">
        <h1>SP Grid Atlas</h1>
        <div className="sub">6.6KV/LV Distribution Substations</div>
        <div className="stat">
          <div><b>{DATA.length}</b><span>Substations</span></div>
          <div><b>{ZONE_ORDER.length}</b><span>Zones</span></div>
          <div><b>{filtered.length}</b><span>Shown</span></div>
        </div>
      </div>

      <div className="plan">
        <button className={"plan-btn"+(routeMode?" on":"")}
          onClick={()=>routeMode?exitRoute():setRouteMode(true)}>
          <RouteIcon/>{routeMode?"Exit route mode":"Plan route"}
        </button>
      </div>

      {routeMode ? (
      <div className="rp">
        <div className="rp-hd">
          <h2>Route planner</h2>
          <button className="rp-x" onClick={exitRoute} title="Exit route mode">×</button>
        </div>

        <div className="rp-body">
          <div className="rp-hq">
            <span className="sq">HQ</span>
            <span className="tx">
              <span className="nm">SP Group HQ</span>
              <span className="ad">{HQ.address}</span>
            </span>
            <span className="tag">Start &amp; end</span>
          </div>

          <div className="rp-count">
            <span>Stops</span>
            <b>{stops.length} / {MAX_STOPS} selected</b>
          </div>

          <div className="rp-search">
            <input value={rq} onChange={e=>setRq(e.target.value)}
              disabled={stops.length>=MAX_STOPS}
              placeholder={stops.length>=MAX_STOPS?"Maximum stops reached.":"Search substation to add…"}/>
            {rq.trim() && stops.length<MAX_STOPS && (
              <div className="rp-drop">
                {rResults.length===0
                  ? <div className="rp-none">No matching substation.</div>
                  : rResults.map(d=>(
                    <div key={d.name} className="r" onClick={()=>addStop(d)}>
                      <span className="dot" style={{background:ZONES[d.zone].hex}}></span>
                      <span className="nm">{d.name}</span>
                      <span className="zg">{d.zone}</span>
                    </div>
                  ))}
              </div>
            )}
          </div>

          {stops.length===0
            ? <div className="rp-hint">No stops yet.<br/>Search above to add up to {MAX_STOPS} substations.</div>
            : <div className="rp-stops">
                {stops.map((s,i)=>(
                  <div key={s.name} className={"rp-stop"+(flash?" flash":"")}>
                    <span className="bg" style={{background:ZONES[s.zone].hex}}>{i+1}</span>
                    <span className="nm">{s.name}</span>
                    <span className="zg">{s.zone}</span>
                    <button className="rp-rm" onClick={()=>removeStop(s.name)} title="Remove stop">×</button>
                  </div>
                ))}
              </div>}
        </div>

        <div className="rp-act">
          <button className="rp-btn ghost" disabled={stops.length<2} onClick={optimiseRoute}>Optimise route</button>
          {stops.length
            ? <a className="rp-btn primary" href={routeUrl} target="_blank" rel="noopener noreferrer">Open in Google Maps →</a>
            : <button className="rp-btn primary" disabled>Open in Google Maps →</button>}
          <button className="rp-btn quiet" disabled={!stops.length} onClick={copyRouteLink}>
            {copied?"Link copied":"Copy route link"}
          </button>
          <button className="rp-btn quiet" onClick={clearRoute}>Clear route</button>
        </div>
      </div>
      ) : (
      <>
      <div className="controls">
        <div className="search">
          <Icon/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search substation or zone…"/>
        </div>
        <div className="row">
          <label>Sort</label>
          <select value={sort} onChange={e=>setSort(e.target.value)}>
            <option value="name">Name (A–Z)</option>
            <option value="zone">Zone</option>
            <option value="lat">Latitude (N→S)</option>
            <option value="lng">Longitude (W→E)</option>
          </select>
        </div>
      </div>

      <div className="zones">
        <div className="hd">Operational zones — click to zoom</div>
        <div className="zgrid">
          {ZONE_ORDER.map(z=>(
            <button key={z} className={"zbtn"+(active.has(z)?"":" off")}
              onClick={()=>zoomZone(z)}
              onContextMenu={e=>{e.preventDefault();toggleZone(z);}}
              title="Click: zoom to zone · Right-click: toggle">
              <span className="dot" style={{background:ZONES[z].hex}}></span>
              <span className="zn">{z}</span>
              <span className="zc">{counts[z]||0}</span>
            </button>
          ))}
        </div>
        <div className="zall">
          <button onClick={()=>{setActive(new Set(ZONE_ORDER));resetView();}}>Show all</button>
          <button onClick={()=>setActive(new Set())}>Hide all</button>
        </div>
      </div>

      <div className="cluster">
        <button className={"cl-btn"+(cluster?" on":"")} disabled={!canCluster}
          onClick={()=>setCluster(!cluster)}
          title={canCluster?"Group nearby pins into clusters":"Clustering library unavailable"}>
          Cluster pins <span className="st">{cluster?"On":"Off"}</span>
        </button>
      </div>

      {topVisited.length>0 && (
      <div className="visited">
        <div className="vhd">
          <span>Pinned sites</span>
          <div className="seg">
            <button className={visitMode==="often"?"on":""} onClick={()=>setVisitMode("often")}>Most visited</button>
            <button className={visitMode==="recent"?"on":""} onClick={()=>setVisitMode("recent")}>Recent</button>
          </div>
        </div>
        {topVisited.map((r,i)=>(
          <div key={r.d.name} className={"vrow"+(sel===r.d.name?" active":"")} onClick={()=>flyTo(r.d)}>
            <span className="vn">{i+1}</span>
            <span className="dot" style={{background:ZONES[r.d.zone].hex}}></span>
            <span className="nm">{r.d.name}</span>
            <span className="vc">{visitMode==="often"?r.n+(r.n===1?" visit":" visits"):sinceLabel(r.t)}</span>
          </div>
        ))}
      </div>)}

      <div className="list">
        {filtered.length===0 && <div className="empty">No substations match.<br/>Try a different name or switch a zone back on.</div>}
        {filtered.map(d=>(
          <div key={d.name} className={"item"+(sel===d.name?" active":"")} onClick={()=>flyTo(d)}>
            <span className="dot" style={{background:ZONES[d.zone].hex}}></span>
            <span className="nm">{d.name}</span>
            <span className="zg">{d.zone}</span>
          </div>
        ))}
      </div>
      </>
      )}
    </div>

    <div className="stage">
      <div ref={elRef} id="map" style={tilesBlocked&&basemap==="dark"?{background:"#101014"}:undefined}></div>
      {tilesBlocked && <div className="offline">Tile server unreachable — showing built-in coastline</div>}
      <div className="basemap">
        {BASEMAP_ORDER.map(k=>(
          <button key={k} className={basemap===k?"on":""} onClick={()=>setBasemap(k)}>{BASEMAPS[k].label}</button>
        ))}
      </div>
      <div className="counter"><b>{filtered.length}</b> of {DATA.length} shown</div>
      <div className="legend">
        {cluster ? (<>
          <div className="lt">Substation density</div>
          <div className="dscale">
            {DENSITY[basemap].map((s,i)=>(
              <span key={i} className="dsw" style={{background:s.c}} title={DENSITY_LABELS[i]+" substations"}></span>
            ))}
          </div>
          <div className="dends"><span>Fewer</span><span>More</span></div>
        </>) : (<>
          <div className="lt">Zone</div>
          {ZONE_ORDER.map(z=>(
            <div className="lr" key={z}><span className="dot" style={{background:ZONES[z].hex}}></span>{z}</div>
          ))}
        </>)}
      </div>
    </div>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
