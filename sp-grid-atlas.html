<style>
  :root{
    --bg:#0e1420; --panel:#151d2b; --panel2:#1b2536; --line:#25324a;
    --ink:#e8eef7; --ink-dim:#93a2bd; --ink-faint:#5f6f8c;
    --accent:#38bdf8; --accent-ink:#04121d;
    --z-central:#818cf8; --z-east:#fbbf24; --z-ne:#34d399;
    --z-north:#f472b6; --z-west:#60a5fa; --z-south:#fb7185;
    --font-d:'Space Grotesk',sans-serif; --font-b:'IBM Plex Sans',sans-serif; --font-m:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-b);overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:360px 1fr;height:100%}
  @media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rail{max-height:46vh}}

  .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .brand h1{font-family:var(--font-d);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .brand .sub{font-size:12px;color:var(--ink-dim);margin-top:4px;font-family:var(--font-m)}
  .stat{display:flex;gap:16px;margin-top:12px}
  .stat b{font-family:var(--font-d);font-size:20px;font-weight:600;display:block;line-height:1}
  .stat span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em}

  .controls{padding:14px 16px;border-bottom:1px solid var(--line)}
  .search{position:relative}
  .search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px 10px 36px;color:var(--ink);font-family:var(--font-b);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
  .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  .row label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em}
  select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    padding:7px 9px;font-family:var(--font-b);font-size:13px;outline:none;cursor:pointer}
  select:focus{border-color:var(--accent)}

  .zones{padding:12px 16px;border-bottom:1px solid var(--line)}
  .zones .hd{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
  .zgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .zbtn{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);font-family:var(--font-b);font-size:13px;
    transition:border-color .12s,background .12s;text-align:left}
  .zbtn:hover{border-color:var(--ink-faint)}
  .zbtn.off{opacity:.4}
  .zbtn .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .zbtn .zn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zbtn .zc{font-family:var(--font-m);font-size:11px;color:var(--ink-dim)}
  .zall{display:flex;gap:8px;margin-top:8px}
  .zall button{flex:1;background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--ink-dim);
    padding:6px;font-size:12px;font-family:var(--font-b);cursor:pointer}
  .zall button:hover{color:var(--ink);border-color:var(--ink-faint)}

  .list{flex:1;overflow-y:auto;min-height:0}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  .item{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:center;transition:background .1s}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .item .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .item .nm{flex:1;font-size:13.5px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .zg{font-family:var(--font-m);font-size:10.5px;color:var(--ink-faint)}
  .empty{padding:34px 20px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.6}

  .stage{position:relative;min-height:0}
  #map{position:absolute;inset:0;background:#0b1119}
  .leaflet-container{background:#0b1119;font-family:var(--font-b)}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--ink);border-radius:11px;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .leaflet-popup-tip{background:var(--panel2);border:1px solid var(--line)}
  .leaflet-popup-content{margin:13px 15px;font-family:var(--font-b)}
  .pop h3{font-family:var(--font-d);font-size:15px;margin-bottom:7px}
  .pop .prow{display:flex;justify-content:space-between;gap:20px;font-size:12.5px;padding:3px 0;border-top:1px solid var(--line)}
  .pop .prow span{color:var(--ink-dim)}
  .pop .prow b{font-family:var(--font-m);font-weight:500}
  .pop .zbadge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px}
  .pop .zbadge .dot{width:9px;height:9px;border-radius:50%}
  .gmaps{display:block;margin-top:10px;text-align:center;background:var(--accent);color:var(--accent-ink);
    text-decoration:none;font-weight:600;font-size:12.5px;padding:7px;border-radius:7px;font-family:var(--font-b)}

  .legend{position:absolute;right:12px;bottom:12px;z-index:500;background:rgba(21,29,43,.92);
    backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:12px}
  .legend .lt{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
  .legend .lr{display:flex;align-items:center;gap:8px;padding:2px 0;color:var(--ink-dim)}
  .legend .lr .dot{width:9px;height:9px;border-radius:50%}
  .counter{position:absolute;left:12px;top:12px;z-index:500;background:rgba(21,29,43,.92);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-family:var(--font-m);font-size:12px;color:var(--ink-dim)}
  .counter b{color:var(--ink);font-weight:500}
</style>

<script type="text/babel">
const {useState,useMemo,useRef,useEffect} = React;

const ZONES = {
  "Central":   {color:"var(--z-central)", hex:"#818cf8"},
  "East":      {color:"var(--z-east)",    hex:"#fbbf24"},
  "North-East":{color:"var(--z-ne)",      hex:"#34d399"},
  "North":     {color:"var(--z-north)",   hex:"#f472b6"},
  "West":      {color:"var(--z-west)",    hex:"#60a5fa"},
  "South":     {color:"var(--z-south)",   hex:"#fb7185"},
};
const ZONE_ORDER = ["Central","East","North-East","North","West","South"];
const DATA = window.SUBSTATIONS;

function Icon(){return <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;}

function App(){
  const [q,setQ]=useState("");
  const [sort,setSort]=useState("name");
  const [active,setActive]=useState(new Set(ZONE_ORDER));
  const [sel,setSel]=useState(null);
  const mapRef=useRef(null); const markersRef=useRef({}); const elRef=useRef(null);

  const counts=useMemo(()=>{const c={};DATA.forEach(d=>c[d.zone]=(c[d.zone]||0)+1);return c;},[]);

  const filtered=useMemo(()=>{
    let r=DATA.filter(d=>active.has(d.zone));
    if(q.trim()){const s=q.trim().toLowerCase();r=r.filter(d=>d.name.toLowerCase().includes(s)||d.zone.toLowerCase().includes(s));}
    r=[...r].sort((a,b)=> sort==="name"?a.name.localeCompare(b.name)
      : sort==="zone"?(a.zone.localeCompare(b.zone)||a.name.localeCompare(b.name))
      : sort==="lat"?b.lat-a.lat : a.lng-b.lng);
    return r;
  },[q,sort,active]);

  // init map once
  useEffect(()=>{
    const map=L.map(elRef.current,{zoomControl:true,attributionControl:true}).setView([1.352,103.84],11.4);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
      maxZoom:19,subdomains:"abcd",
      attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
    mapRef.current=map;
    DATA.forEach(d=>{
      const m=L.circleMarker([d.lat,d.lng],{radius:6,weight:1.5,color:"#0b1119",
        fillColor:ZONES[d.zone].hex,fillOpacity:.95}).addTo(map);
      const g="https://www.google.com/maps/search/?api=1&query="+d.lat+","+d.lng;
      m.bindPopup(
        '<div class="pop"><h3>'+d.name+'</h3>'+
        '<div class="prow"><span>Voltage</span><b>'+d.voltage+'</b></div>'+
        '<div class="prow"><span>Lat</span><b>'+d.lat.toFixed(5)+'</b></div>'+
        '<div class="prow"><span>Long</span><b>'+d.lng.toFixed(5)+'</b></div>'+
        '<div class="zbadge"><span class="dot" style="background:'+ZONES[d.zone].hex+'"></span>'+d.zone+' Zone</div>'+
        '<a class="gmaps" href="'+g+'" target="_blank" rel="noopener">Open in Google Maps</a></div>');
      m.on("click",()=>setSel(d.name));
      markersRef.current[d.name]=m;
    });
    return ()=>map.remove();
  },[]);

  // show/hide markers by zone+search
  useEffect(()=>{
    const vis=new Set(filtered.map(d=>d.name));
    Object.entries(markersRef.current).forEach(([nm,m])=>{
      const on=vis.has(nm); const el=m.getElement();
      if(el) el.style.display=on?"":"none";
    });
  },[filtered]);

  function flyTo(d){const m=mapRef.current;m.flyTo([d.lat,d.lng],16,{duration:.7});
    setTimeout(()=>markersRef.current[d.name].openPopup(),650);setSel(d.name);}
  function zoomZone(z){
    const pts=DATA.filter(d=>d.zone===z);if(!pts.length)return;
    const b=L.latLngBounds(pts.map(d=>[d.lat,d.lng]));
    mapRef.current.flyToBounds(b,{padding:[50,50],duration:.7,maxZoom:14.5});
    setActive(new Set([z]));
  }
  function toggleZone(z){const n=new Set(active);n.has(z)?n.delete(z):n.add(z);setActive(n);}
  function resetView(){mapRef.current.flyTo([1.352,103.84],11.4,{duration:.7});}

  return (
   <div className="app">
    <div className="rail">
      <div className="brand">
        <h1>SP Grid Atlas</h1>
        <div className="sub">6.6KV/LV Distribution Substations</div>
        <div className="stat">
          <div><b>{DATA.length}</b><span>Substations</span></div>
          <div><b>{ZONE_ORDER.length}</b><span>Zones</span></div>
          <div><b>{filtered.length}</b><span>Shown</span></div>
        </div>
      </div>

      <div className="controls">
        <div className="search">
          <Icon/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search substation or zone…"/>
        </div>
        <div className="row">
          <label>Sort</label>
          <select value={sort} onChange={e=>setSort(e.target.value)}>
            <option value="name">Name (A–Z)</option>
            <option value="zone">Zone</option>
            <option value="lat">Latitude (N→S)</option>
            <option value="lng">Longitude (W→E)</option>
          </select>
        </div>
      </div>

      <div className="zones">
        <div className="hd">Operational zones — click to zoom</div>
        <div className="zgrid">
          {ZONE_ORDER.map(z=>(
            <button key={z} className={"zbtn"+(active.has(z)?"":" off")}
              onClick={()=>zoomZone(z)}
              onContextMenu={e=>{e.preventDefault();toggleZone(z);}}
              title="Click: zoom to zone · Right-click: toggle">
              <span className="dot" style={{background:ZONES[z].hex}}></span>
              <span className="zn">{z}</span>
              <span className="zc">{counts[z]||0}</span>
            </button>
          ))}
        </div>
        <div className="zall">
          <button onClick={()=>{setActive(new Set(ZONE_ORDER));resetView();}}>Show all</button>
          <button onClick={()=>setActive(new Set())}>Hide all</button>
        </div>
      </div>

      <div className="list">
        {filtered.length===0 && <div className="empty">No substations match.<br/>Try a different name or switch a zone back on.</div>}
        {filtered.map(d=>(
          <div key={d.name} className={"item"+(sel===d.name?" active":"")} onClick={()=>flyTo(d)}>
            <span className="dot" style={{background:ZONES[d.zone].hex}}></span>
            <span className="nm">{d.name}</span>
            <span className="zg">{d.zone}</span>
          </div>
        ))}
      </div>
    </div>

    <div className="stage">
      <div ref={elRef} id="map"></div>
      <div className="counter"><b>{filtered.length}</b> of {DATA.length} shown</div>
      <div className="legend">
        <div className="lt">Zone</div>
        {ZONE_ORDER.map(z=>(
          <div className="lr" key={z}><span className="dot" style={{background:ZONES[z].hex}}></span>{z}</div>
        ))}
      </div>
    </div>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
