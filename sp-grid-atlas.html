<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SP Grid Atlas — 6.6KV/LV Substations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css"/>
<style>
  :root{
    --bg:#f5f5f7; --panel:#ffffff; --panel2:#f5f5f7; --line:#d2d2d7;
    --ink:#1d1d1f; --ink-dim:#6e6e73; --ink-faint:#86868b;
    --accent:#e8002d; --accent-ink:#ffffff;
    --z-central:#818cf8; --z-east:#fbbf24; --z-ne:#34d399;
    --z-north:#f472b6; --z-west:#60a5fa; --z-south:#fb7185;
    --shadow:0 1px 3px rgba(0,0,0,.08);
    --font-b:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
    --font-d:var(--font-b);
    --font-m:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-b);overflow:hidden;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:360px 1fr;height:100%}
  @media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rail{max-height:46vh}}

  .rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:24px 20px 20px;border-bottom:1px solid var(--line)}
  .brand h1{font-family:var(--font-d);font-size:21px;font-weight:600;letter-spacing:-.021em;line-height:1.15}
  .brand .sub{font-size:13px;color:var(--ink-dim);margin-top:5px;line-height:1.4}
  .stat{display:flex;gap:22px;margin-top:18px}
  .stat b{font-family:var(--font-d);font-size:22px;font-weight:600;display:block;line-height:1;letter-spacing:-.02em}
  .stat span{font-size:12px;color:var(--ink-faint);display:block;margin-top:5px}

  .controls{padding:16px 20px;border-bottom:1px solid var(--line)}
  .search{position:relative}
  .search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px 11px 38px;color:var(--ink);font-family:var(--font-b);font-size:14px;outline:none;
    transition:border-color .15s,box-shadow .15s}
  .search input::placeholder{color:var(--ink-faint)}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,0,45,.1)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
  .row{display:flex;gap:10px;margin-top:12px;align-items:center}
  .row label{font-size:13px;color:var(--ink-dim)}
  select{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    padding:9px 11px;font-family:var(--font-b);font-size:13px;outline:none;cursor:pointer}
  select:focus{border-color:var(--accent)}

  .zones{padding:16px 20px;border-bottom:1px solid var(--line)}
  .zones .hd{font-size:13px;color:var(--ink-dim);margin-bottom:11px}
  .zgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .zbtn{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:9px 11px;cursor:pointer;color:var(--ink);font-family:var(--font-b);font-size:13px;
    transition:background .15s,border-color .15s;text-align:left}
  .zbtn:hover{background:var(--panel2)}
  .zbtn.off{opacity:.4}
  .zbtn .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .zbtn .zn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zbtn .zc{font-family:var(--font-m);font-size:11px;color:var(--ink-faint)}
  .zall{display:flex;gap:8px;margin-top:10px}
  .zall button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:980px;color:var(--ink-dim);
    padding:8px;font-size:13px;font-family:var(--font-b);cursor:pointer;transition:background .15s,color .15s}
  .zall button:hover{color:var(--ink);background:var(--panel2)}

  .cluster{padding:16px 20px;border-bottom:1px solid var(--line)}
  .cl-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:980px;color:var(--ink);
    font-family:var(--font-b);font-size:14px;font-weight:500;padding:11px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s}
  .cl-btn:hover:not(:disabled):not(.on){background:var(--panel2)}
  .cl-btn.on:hover{opacity:.88}
  .cl-btn:disabled{opacity:.4;cursor:not-allowed}
  .cl-btn .st{font-size:12px;font-weight:400;color:var(--ink-faint);border:1px solid var(--line);
    border-radius:980px;padding:1px 9px}
  .cl-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .cl-btn.on .st{color:var(--accent-ink);border-color:rgba(255,255,255,.55)}

  .list{flex:1;overflow-y:auto;min-height:0}
  .list::-webkit-scrollbar{width:10px}
  .list::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:6px;border:3px solid var(--panel);background-clip:padding-box}
  .item{padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px;align-items:center;transition:background .12s}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .item .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .item .nm{flex:1;font-size:14px;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .zg{font-size:12px;color:var(--ink-faint)}
  .empty{padding:40px 24px;text-align:center;color:var(--ink-faint);font-size:14px;line-height:1.6}

  .stage{position:relative;min-height:0}
  #map{position:absolute;inset:0;background:var(--bg)}
  .leaflet-container{background:var(--bg);font-family:var(--font-b)}
  .leaflet-bar{border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  .leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
  .leaflet-bar a:hover{background:var(--panel2);color:var(--ink)}
  .leaflet-control-attribution{background:rgba(255,255,255,.85)!important;color:var(--ink-faint);
    border-radius:8px 0 0 0;font-size:11px}
  .leaflet-control-attribution a{color:var(--ink-dim)}
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:12px;
    border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.12)}
  .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
  .leaflet-popup-content{margin:16px 18px;font-family:var(--font-b)}
  .pop h3{font-family:var(--font-d);font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
  .pop .prow{display:flex;justify-content:space-between;gap:24px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
  .pop .prow span{color:var(--ink-dim)}
  .pop .prow b{font-family:var(--font-m);font-weight:500}
  .pop .zbadge{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;color:var(--ink-dim)}
  .pop .zbadge .dot{width:9px;height:9px;border-radius:50%}
  .leaflet-container a.gmaps{display:block;margin-top:14px;text-align:center;background:var(--accent);
    color:var(--accent-ink);text-decoration:none;font-weight:500;font-size:13px;padding:9px;
    border-radius:980px;font-family:var(--font-b)}
  .leaflet-container a.gmaps:hover{opacity:.88}

  .legend{position:absolute;right:16px;bottom:24px;z-index:500;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    font-size:13px;box-shadow:var(--shadow)}
  .legend .lt{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
  .legend .lr{display:flex;align-items:center;gap:9px;padding:3px 0;color:var(--ink-dim)}
  .legend .lr .dot{width:9px;height:9px;border-radius:50%}
  .counter{position:absolute;left:16px;top:92px;z-index:500;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:9px 14px;
    font-size:13px;color:var(--ink-dim);box-shadow:var(--shadow)}
  .counter b{color:var(--ink);font-weight:600}

  .offline{position:absolute;left:16px;bottom:24px;z-index:500;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:9px 14px;
    font-size:12px;color:var(--ink-dim);box-shadow:var(--shadow);max-width:280px;line-height:1.4}
  .basemap{position:absolute;right:16px;top:16px;z-index:500;display:flex;gap:5px;padding:5px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--shadow)}
  .basemap button{background:var(--panel);border:1px solid var(--line);border-radius:980px;padding:6px 15px;
    font-family:var(--font-b);font-size:12.5px;color:var(--ink-dim);cursor:pointer;transition:.15s}
  .basemap button:hover{color:var(--ink);background:var(--panel2)}
  .basemap button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .cl-icon{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-b);font-size:13px;
    font-weight:600;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}

  /* ── Route Planner ───────────────────────────────────────── */
  .plan{padding:16px 20px 0}
  .plan-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
    background:var(--accent);border:1px solid var(--accent);border-radius:980px;color:var(--accent-ink);
    font-family:var(--font-b);font-size:14px;font-weight:500;padding:11px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,opacity .15s}
  .plan-btn:hover{opacity:.88}
  .plan-btn.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
  .plan-btn.on:hover{background:var(--panel2);opacity:1}

  .rp{display:flex;flex-direction:column;flex:1;min-height:0}
  .rp-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .rp-hd h2{font-family:var(--font-d);font-size:17px;font-weight:600;letter-spacing:-.015em}
  .rp-x{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--line);border-radius:50%;color:var(--ink-dim);
    font-size:16px;line-height:1;cursor:pointer;transition:.15s}
  .rp-x:hover{color:var(--ink);background:var(--panel2)}

  .rp-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 20px}
  .rp-body::-webkit-scrollbar{width:10px}
  .rp-body::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:6px;border:3px solid var(--panel);background-clip:padding-box}

  .rp-hq{display:flex;align-items:center;gap:12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .rp-hq .sq{width:26px;height:26px;flex:none;border-radius:7px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.02em}
  .rp-hq .tx{flex:1;min-width:0;display:block}
  .rp-hq .nm{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-hq .ad{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-hq .tag{flex:none;font-size:11px;color:var(--accent);border:1px solid rgba(232,0,45,.3);
    border-radius:980px;padding:3px 9px;white-space:nowrap}

  .rp-count{display:flex;align-items:center;justify-content:space-between;margin-top:18px;
    font-size:13px;color:var(--ink-dim)}
  .rp-count b{font-size:13px;color:var(--ink);font-weight:600}

  .rp-search{position:relative;margin-top:10px}
  .rp-search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;color:var(--ink);font-family:var(--font-b);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
  .rp-search input::placeholder{color:var(--ink-faint)}
  .rp-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,0,45,.1)}
  .rp-search input:disabled{opacity:.6;cursor:not-allowed;background:var(--panel2)}
  .rp-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;max-height:228px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
  .rp-drop::-webkit-scrollbar{width:10px}
  .rp-drop::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:6px;border:3px solid var(--panel);background-clip:padding-box}
  .rp-drop .r{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;
    border-bottom:1px solid var(--line);transition:background .12s}
  .rp-drop .r:last-child{border-bottom:none}
  .rp-drop .r:hover{background:var(--panel2)}
  .rp-drop .r .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .rp-drop .r .nm{flex:1;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-drop .r .zg{font-size:11.5px;color:var(--ink-faint)}
  .rp-none{padding:14px;text-align:center;font-size:13px;color:var(--ink-faint)}

  .rp-stops{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .rp-stop{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px}
  .rp-stop .bg{width:24px;height:24px;flex:none;border-radius:50%;color:#1d1d1f;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .rp-stop .nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-stop .zg{flex:none;font-size:11.5px;color:var(--ink-faint)}
  .rp-rm{flex:none;background:transparent;border:none;color:var(--ink-faint);cursor:pointer;
    font-size:16px;line-height:1;padding:2px 3px;transition:color .15s}
  .rp-rm:hover{color:var(--accent)}
  @keyframes rpflash{0%{background:rgba(232,0,45,.12);border-color:var(--accent);transform:translateX(5px)}
    100%{background:var(--panel);border-color:var(--line);transform:none}}
  .rp-stop.flash{animation:rpflash .7s ease-out}
  .rp-hint{margin-top:14px;padding:24px 16px;text-align:center;border:1px dashed var(--line);
    border-radius:12px;color:var(--ink-faint);font-size:13px;line-height:1.6}

  .rp-act{display:flex;flex-direction:column;gap:9px;padding:16px 20px;border-top:1px solid var(--line)}
  .rp-btn{width:100%;border-radius:980px;padding:11px;border:1px solid var(--line);cursor:pointer;
    font-family:var(--font-b);font-size:14px;font-weight:500;transition:background .15s,opacity .15s,color .15s}
  .rp-btn:disabled{opacity:.36;cursor:not-allowed}
  .rp-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .rp-btn.primary:hover:not(:disabled){opacity:.88}
  .rp-btn.ghost{background:var(--panel);color:var(--ink)}
  .rp-btn.ghost:hover:not(:disabled){background:var(--panel2)}
  .rp-btn.quiet{background:transparent;border-color:transparent;color:var(--ink-dim)}
  .rp-btn.quiet:hover:not(:disabled){color:var(--ink);background:var(--panel2)}

  .rp-hq-icon{width:28px;height:28px;border-radius:8px;background:#fff;color:var(--accent);
    border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;
    font-family:var(--font-b);font-size:9.5px;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.25)}
  .rp-num-icon{width:26px;height:26px;border-radius:50%;color:#1d1d1f;border:2.5px solid #fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-b);font-size:12px;
    font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.28)}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const {useState,useMemo,useRef,useEffect} = React;

const ZONES = {
  "Central":   {color:"var(--z-central)", hex:"#818cf8"},
  "East":      {color:"var(--z-east)",    hex:"#fbbf24"},
  "North-East":{color:"var(--z-ne)",      hex:"#34d399"},
  "North":     {color:"var(--z-north)",   hex:"#f472b6"},
  "West":      {color:"var(--z-west)",    hex:"#60a5fa"},
  "South":     {color:"var(--z-south)",   hex:"#fb7185"},
};
const ZONE_ORDER = ["Central","East","North-East","North","West","South"];
const DATA = window.SUBSTATIONS;

const HQ = {name:"SP Group HQ", address:"2 Kallang Sector, Singapore 349277", lat:1.3127, lng:103.8698};
const MAX_STOPS = 5;

const BASEMAPS = {
  dark: {label:"Dark",  url:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"},
  light:{label:"Light", url:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"},
  grey: {label:"Grey",  url:"https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png"},
};
const BASEMAP_ORDER = ["dark","light","grey"];

// Tiles come from an external CDN. Corporate networks and sandboxed viewers often
// block it, which would otherwise leave a blank map, so failures are reported back
// and the embedded vector coastline stands in.
function makeTileLayer(key,onErr,onOk){
  return L.tileLayer(BASEMAPS[key].url,{maxZoom:19,subdomains:"abcd",
    attribution:'&copy; OpenStreetMap &copy; CARTO'}).on("tileerror",onErr).on("tileload",onOk);
}

// Sorting every vertex by its bearing around an interior point always yields a
// simple polygon, so the route can never cross itself.
function angularSweepRoute(hq,stops){
  if(stops.length<2) return [...stops];
  const ring=[hq,...stops];
  const cLat=ring.reduce((s,p)=>s+p.lat,0)/ring.length;
  const cLng=ring.reduce((s,p)=>s+p.lng,0)/ring.length;
  const bearing=p=>{
    const a=Math.atan2(p.lat-cLat,(p.lng-cLng)*Math.cos(cLat*Math.PI/180));
    return a<0?a+2*Math.PI:a;
  };
  const swept=[...ring].sort((a,b)=>bearing(a)-bearing(b));
  const h=swept.indexOf(hq);
  return [...swept.slice(h+1),...swept.slice(0,h)];
}

function Icon(){return <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;}
function RouteIcon(){return <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19h6a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7h6"/></svg>;}

function App(){
  const [q,setQ]=useState("");
  const [sort,setSort]=useState("name");
  const [active,setActive]=useState(new Set(ZONE_ORDER));
  const [sel,setSel]=useState(null);
  const [routeMode,setRouteMode]=useState(false);
  const [stops,setStops]=useState([]);
  const [rq,setRq]=useState("");
  const [flash,setFlash]=useState(false);
  const [basemap,setBasemap]=useState("light");
  const [cluster,setCluster]=useState(false);
  const [tilesBlocked,setTilesBlocked]=useState(false);
  const mapRef=useRef(null); const markersRef=useRef({}); const elRef=useRef(null);
  const routeLayerRef=useRef(null); const tileRef=useRef(null); const clusterRef=useRef(null);
  const outlineRef=useRef(null);
  const canCluster = typeof L.markerClusterGroup === "function";

  const counts=useMemo(()=>{const c={};DATA.forEach(d=>c[d.zone]=(c[d.zone]||0)+1);return c;},[]);

  const filtered=useMemo(()=>{
    let r=DATA.filter(d=>active.has(d.zone));
    if(q.trim()){const s=q.trim().toLowerCase();r=r.filter(d=>d.name.toLowerCase().includes(s)||d.zone.toLowerCase().includes(s));}
    r=[...r].sort((a,b)=> sort==="name"?a.name.localeCompare(b.name)
      : sort==="zone"?(a.zone.localeCompare(b.zone)||a.name.localeCompare(b.name))
      : sort==="lat"?b.lat-a.lat : a.lng-b.lng);
    return r;
  },[q,sort,active]);

  // init map once
  useEffect(()=>{
    const map=L.map(elRef.current,{zoomControl:true,attributionControl:true}).setView([1.352,103.84],11.4);
    tileRef.current=makeTileLayer("light",()=>setTilesBlocked(true),()=>setTilesBlocked(false)).addTo(map);
    mapRef.current=map;
    DATA.forEach(d=>{
      const m=L.circleMarker([d.lat,d.lng],{radius:6,weight:1.5,color:"#0b1119",
        fillColor:ZONES[d.zone].hex,fillOpacity:.95}).addTo(map);
      const g="https://www.google.com/maps/search/?api=1&query="+d.lat+","+d.lng;
      m.bindPopup(
        '<div class="pop"><h3>'+d.name+'</h3>'+
        '<div class="prow"><span>Voltage</span><b>'+d.voltage+'</b></div>'+
        '<div class="prow"><span>Lat</span><b>'+d.lat.toFixed(5)+'</b></div>'+
        '<div class="prow"><span>Long</span><b>'+d.lng.toFixed(5)+'</b></div>'+
        '<div class="zbadge"><span class="dot" style="background:'+ZONES[d.zone].hex+'"></span>'+d.zone+' Zone</div>'+
        '<a class="gmaps" href="'+g+'" target="_blank" rel="noopener">Open in Google Maps</a></div>');
      m.on("click",()=>setSel(d.name));
      markersRef.current[d.name]=m;
    });
    routeLayerRef.current=L.layerGroup().addTo(map);
    if(canCluster){
      clusterRef.current=L.markerClusterGroup({
        showCoverageOnHover:false, maxClusterRadius:60, chunkedLoading:true,
        iconCreateFunction:c=>L.divIcon({className:"",iconSize:[38,38],
          html:'<div class="cl-icon">'+c.getChildCount()+'</div>'})
      });
    }
    return ()=>map.remove();
  },[]);

  // swap the tile layer without disturbing markers or the current view
  useEffect(()=>{
    const map=mapRef.current; if(!map||!tileRef.current) return;
    map.removeLayer(tileRef.current);
    tileRef.current=makeTileLayer(basemap,()=>setTilesBlocked(true),()=>setTilesBlocked(false)).addTo(map);
  },[basemap]);

  // vector coastline fallback, shown only when the tile CDN is unreachable
  useEffect(()=>{
    const map=mapRef.current; if(!map) return;
    if(outlineRef.current){map.removeLayer(outlineRef.current);outlineRef.current=null;}
    if(!tilesBlocked) return;
    const dark=basemap==="dark";
    outlineRef.current=L.geoJSON({type:"Feature",geometry:window.SG_OUTLINE},{
      interactive:false,
      style:{color:dark?"#3a3a3e":"#b8b8bd",weight:1,
        fillColor:dark?"#1f1f23":"#ffffff",fillOpacity:1}
    }).addTo(map);
    outlineRef.current.bringToBack();
  },[tilesBlocked,basemap]);

  // draw HQ marker, numbered stop markers and the closed-loop polyline
  useEffect(()=>{
    const layer=routeLayerRef.current; if(!layer) return;
    layer.clearLayers();
    if(!routeMode||stops.length===0) return;

    const line=[[HQ.lat,HQ.lng],...stops.map(s=>[s.lat,s.lng]),[HQ.lat,HQ.lng]];
    L.polyline(line,{color:"#e8002d",weight:3.5,opacity:.9,dashArray:"9 7",lineJoin:"round"}).addTo(layer);

    L.marker([HQ.lat,HQ.lng],{
      icon:L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,13],html:'<div class="rp-hq-icon">HQ</div>'}),
      zIndexOffset:1000
    }).addTo(layer).bindPopup(
      '<div class="pop"><h3>SP Group HQ</h3>'+
      '<div class="prow"><span>Address</span><b>2 Kallang Sector</b></div>'+
      '<div class="prow"><span>Postal</span><b>349277</b></div>'+
      '<div class="prow"><span>Role</span><b>Start &amp; end</b></div></div>');

    stops.forEach((s,i)=>{
      L.marker([s.lat,s.lng],{
        icon:L.divIcon({className:"",iconSize:[24,24],iconAnchor:[12,12],
          html:'<div class="rp-num-icon" style="background:'+ZONES[s.zone].hex+'">'+(i+1)+'</div>'}),
        zIndexOffset:900
      }).addTo(layer).bindPopup(
        '<div class="pop"><h3>Stop '+(i+1)+' — '+s.name+'</h3>'+
        '<div class="prow"><span>Lat</span><b>'+s.lat.toFixed(5)+'</b></div>'+
        '<div class="prow"><span>Long</span><b>'+s.lng.toFixed(5)+'</b></div>'+
        '<div class="zbadge"><span class="dot" style="background:'+ZONES[s.zone].hex+'"></span>'+s.zone+' Zone</div></div>');
    });
  },[routeMode,stops]);

  const rResults=useMemo(()=>{
    const s=rq.trim().toLowerCase(); if(!s) return [];
    const taken=new Set(stops.map(x=>x.name));
    return DATA.filter(d=>!taken.has(d.name)&&d.name.toLowerCase().includes(s)).slice(0,8);
  },[rq,stops]);

  function addStop(d){
    if(stops.length>=MAX_STOPS||stops.some(s=>s.name===d.name)) return;
    const next=[...stops,d];
    setStops(next); setRq("");
    mapRef.current.flyToBounds(
      L.latLngBounds([[HQ.lat,HQ.lng],...next.map(s=>[s.lat,s.lng])]),
      {padding:[70,70],duration:.6,maxZoom:15});
  }
  function removeStop(name){setStops(stops.filter(s=>s.name!==name));}
  function optimiseRoute(){
    if(stops.length<2) return;
    setStops(angularSweepRoute(HQ,stops));
    setFlash(true); setTimeout(()=>setFlash(false),700);
  }
  function openInGoogleMaps(){
    if(!stops.length) return;
    const path=[HQ,...stops,HQ].map(p=>p.lat+","+p.lng).join("/");
    window.open("https://www.google.com/maps/dir/"+path,"_blank","noopener");
  }
  function clearRoute(){setStops([]);setRq("");}
  function exitRoute(){setRouteMode(false);setStops([]);setRq("");}

  // show/hide markers by zone+search, routed through the cluster group when clustering is on
  useEffect(()=>{
    const map=mapRef.current; if(!map) return;
    const cg=clusterRef.current;
    const vis=new Set(filtered.map(d=>d.name));
    if(cluster&&cg){
      const inCluster=[];
      Object.entries(markersRef.current).forEach(([nm,m])=>{
        if(map.hasLayer(m)) map.removeLayer(m);
        if(vis.has(nm)) inCluster.push(m);
      });
      cg.clearLayers();
      cg.addLayers(inCluster);
      if(!map.hasLayer(cg)) map.addLayer(cg);
    }else{
      if(cg&&map.hasLayer(cg)){map.removeLayer(cg);cg.clearLayers();}
      Object.entries(markersRef.current).forEach(([nm,m])=>{
        if(!map.hasLayer(m)) m.addTo(map);
        const el=m.getElement();
        if(el) el.style.display=vis.has(nm)?"":"none";
      });
    }
  },[filtered,cluster]);

  function flyTo(d){const m=mapRef.current;const mk=markersRef.current[d.name];
    if(cluster&&clusterRef.current&&clusterRef.current.hasLayer(mk)){
      setSel(d.name);clusterRef.current.zoomToShowLayer(mk,()=>mk.openPopup());return;}
    m.flyTo([d.lat,d.lng],16,{duration:.7});
    setTimeout(()=>mk.openPopup(),650);setSel(d.name);}
  function zoomZone(z){
    const pts=DATA.filter(d=>d.zone===z);if(!pts.length)return;
    const b=L.latLngBounds(pts.map(d=>[d.lat,d.lng]));
    mapRef.current.flyToBounds(b,{padding:[50,50],duration:.7,maxZoom:14.5});
    setActive(new Set([z]));
  }
  function toggleZone(z){const n=new Set(active);n.has(z)?n.delete(z):n.add(z);setActive(n);}
  function resetView(){mapRef.current.flyTo([1.352,103.84],11.4,{duration:.7});}

  return (
   <div className="app">
    <div className="rail">
      <div className="brand">
        <h1>SP Grid Atlas</h1>
        <div className="sub">6.6KV/LV Distribution Substations</div>
        <div className="stat">
          <div><b>{DATA.length}</b><span>Substations</span></div>
          <div><b>{ZONE_ORDER.length}</b><span>Zones</span></div>
          <div><b>{filtered.length}</b><span>Shown</span></div>
        </div>
      </div>

      <div className="plan">
        <button className={"plan-btn"+(routeMode?" on":"")}
          onClick={()=>routeMode?exitRoute():setRouteMode(true)}>
          <RouteIcon/>{routeMode?"Exit route mode":"Plan route"}
        </button>
      </div>

      {routeMode ? (
      <div className="rp">
        <div className="rp-hd">
          <h2>Route planner</h2>
          <button className="rp-x" onClick={exitRoute} title="Exit route mode">×</button>
        </div>

        <div className="rp-body">
          <div className="rp-hq">
            <span className="sq">HQ</span>
            <span className="tx">
              <span className="nm">SP Group HQ</span>
              <span className="ad">{HQ.address}</span>
            </span>
            <span className="tag">Start &amp; end</span>
          </div>

          <div className="rp-count">
            <span>Stops</span>
            <b>{stops.length} / {MAX_STOPS} selected</b>
          </div>

          <div className="rp-search">
            <input value={rq} onChange={e=>setRq(e.target.value)}
              disabled={stops.length>=MAX_STOPS}
              placeholder={stops.length>=MAX_STOPS?"Maximum stops reached.":"Search substation to add…"}/>
            {rq.trim() && stops.length<MAX_STOPS && (
              <div className="rp-drop">
                {rResults.length===0
                  ? <div className="rp-none">No matching substation.</div>
                  : rResults.map(d=>(
                    <div key={d.name} className="r" onClick={()=>addStop(d)}>
                      <span className="dot" style={{background:ZONES[d.zone].hex}}></span>
                      <span className="nm">{d.name}</span>
                      <span className="zg">{d.zone}</span>
                    </div>
                  ))}
              </div>
            )}
          </div>

          {stops.length===0
            ? <div className="rp-hint">No stops yet.<br/>Search above to add up to {MAX_STOPS} substations.</div>
            : <div className="rp-stops">
                {stops.map((s,i)=>(
                  <div key={s.name} className={"rp-stop"+(flash?" flash":"")}>
                    <span className="bg" style={{background:ZONES[s.zone].hex}}>{i+1}</span>
                    <span className="nm">{s.name}</span>
                    <span className="zg">{s.zone}</span>
                    <button className="rp-rm" onClick={()=>removeStop(s.name)} title="Remove stop">×</button>
                  </div>
                ))}
              </div>}
        </div>

        <div className="rp-act">
          <button className="rp-btn ghost" disabled={stops.length<2} onClick={optimiseRoute}>Optimise route</button>
          <button className="rp-btn primary" disabled={stops.length<1} onClick={openInGoogleMaps}>Open in Google Maps →</button>
          <button className="rp-btn quiet" onClick={clearRoute}>Clear route</button>
        </div>
      </div>
      ) : (
      <>
      <div className="controls">
        <div className="search">
          <Icon/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search substation or zone…"/>
        </div>
        <div className="row">
          <label>Sort</label>
          <select value={sort} onChange={e=>setSort(e.target.value)}>
            <option value="name">Name (A–Z)</option>
            <option value="zone">Zone</option>
            <option value="lat">Latitude (N→S)</option>
            <option value="lng">Longitude (W→E)</option>
          </select>
        </div>
      </div>

      <div className="zones">
        <div className="hd">Operational zones — click to zoom</div>
        <div className="zgrid">
          {ZONE_ORDER.map(z=>(
            <button key={z} className={"zbtn"+(active.has(z)?"":" off")}
              onClick={()=>zoomZone(z)}
              onContextMenu={e=>{e.preventDefault();toggleZone(z);}}
              title="Click: zoom to zone · Right-click: toggle">
              <span className="dot" style={{background:ZONES[z].hex}}></span>
              <span className="zn">{z}</span>
              <span className="zc">{counts[z]||0}</span>
            </button>
          ))}
        </div>
        <div className="zall">
          <button onClick={()=>{setActive(new Set(ZONE_ORDER));resetView();}}>Show all</button>
          <button onClick={()=>setActive(new Set())}>Hide all</button>
        </div>
      </div>

      <div className="cluster">
        <button className={"cl-btn"+(cluster?" on":"")} disabled={!canCluster}
          onClick={()=>setCluster(!cluster)}
          title={canCluster?"Group nearby pins into clusters":"Clustering library unavailable"}>
          Cluster pins <span className="st">{cluster?"On":"Off"}</span>
        </button>
      </div>

      <div className="list">
        {filtered.length===0 && <div className="empty">No substations match.<br/>Try a different name or switch a zone back on.</div>}
        {filtered.map(d=>(
          <div key={d.name} className={"item"+(sel===d.name?" active":"")} onClick={()=>flyTo(d)}>
            <span className="dot" style={{background:ZONES[d.zone].hex}}></span>
            <span className="nm">{d.name}</span>
            <span className="zg">{d.zone}</span>
          </div>
        ))}
      </div>
      </>
      )}
    </div>

    <div className="stage">
      <div ref={elRef} id="map" style={tilesBlocked&&basemap==="dark"?{background:"#101014"}:undefined}></div>
      {tilesBlocked && <div className="offline">Tile server unreachable — showing built-in coastline</div>}
      <div className="basemap">
        {BASEMAP_ORDER.map(k=>(
          <button key={k} className={basemap===k?"on":""} onClick={()=>setBasemap(k)}>{BASEMAPS[k].label}</button>
        ))}
      </div>
      <div className="counter"><b>{filtered.length}</b> of {DATA.length} shown</div>
      <div className="legend">
        <div className="lt">Zone</div>
        {ZONE_ORDER.map(z=>(
          <div className="lr" key={z}><span className="dot" style={{background:ZONES[z].hex}}></span>{z}</div>
        ))}
      </div>
    </div>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
